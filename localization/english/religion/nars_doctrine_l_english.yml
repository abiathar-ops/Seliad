l_english:
  tenet_nars_pantheon_name:0 "Unbroken Fate"
  tenet_nars_pantheon_no_actor:0 "Anánkē"
  tenet_nars_pantheon_desc:0 "Religious priests warn in the Gods' power but they also remind the populace to not trust in their benevolence.\n\n[Glossary('Kataphronoūntes Isasin Auxēsin Ouk Epischethēsomēn.', 'NARS_1_RITE_GLOSS')]"

  tenet_nars_sanguine_name:0 "Ancient Heritage"
  tenet_nars_sanguine_no_actor:0 "Palaiótēs"
  tenet_nars_sanguine_desc:0 "Traditions of antiquity, long forgotten by the world, are preserved within our faith.\n\n[Glossary('Kataphronoūntes Isasin Auxēsin Ouk Epischethēsomēn.', 'NARS_1_RITE_GLOSS')]"

  tenet_nars_erudition_name:0 "Divine Wisdom"
  tenet_nars_erudition_no_actor:0 "Sophía"
  tenet_nars_erudition_desc:0 "Scholars who spend time in meditation leave with sharpened insight and spiritual understanding.\n\n[Glossary('Kataphronoūntes Isasin Auxēsin Ouk Epischethēsomēn.', 'NARS_1_RITE_GLOSS')]"

  tenet_nars_endgame_name:0 "Restoration"
  tenet_nars_endgame_no_actor:0 "Katástasis"
  tenet_nars_endgame_desc:0 "The long exile ends, and the lost return to the seat of their ancient dominion, as the cycle always foretold."

  tenet_nars_artisans_name:0 "Blessed Artisans"
  tenet_nars_artisans_no_actor:0 "Dēmiourgía"
  tenet_nars_artisans_desc:0 "The hands that shape clay, bronze, and stone do holy work, and a well-made vessel is its own prayer.\n\n[Glossary('Eugéneian áskei, kakías apékhou.', 'NARS_0_RITE_GLOSS')]"

  tenet_nars_warlike_name:0 "Belligerence"
  tenet_nars_warlike_no_actor:0 "Vandreía"
  tenet_nars_warlike_desc:0 "Discipline forged in youth through drill and hardship makes soldiers worthy of the old glory.\n\n[Glossary('Polemos Pantōn Patēr, Ē Tān Ē Epi Tās.', 'NARS_2_RITE_GLOSS')]"

  tenet_nars_crusade_name:0 "Holy Conquest"
  tenet_nars_crusade_no_actor:0 "Hieròs Pólemos"
  tenet_nars_crusade_desc:0 "Through holy conquest, no border or false creed shall withstand our divine truth.\n\n[Glossary('Polemos Pantōn Patēr, Ē Tān Ē Epi Tās.', 'NARS_2_RITE_GLOSS')]"

  tenet_nars_deviance_name:0 "Sacred Courtesans"
  tenet_nars_deviance_no_actor:0 "Hieródouloi"
  tenet_nars_deviance_desc:0 "Shrouded in taboo, these holy courtesans prove the gods speak clearly through passion.\n\n[Glossary('Polemos Pantōn Patēr, Ē Tān Ē Epi Tās.', 'NARS_2_RITE_GLOSS')]"

 nars_special_name: "Hegemons of Old"
 nars_special_2_name: "Scholars of Yore"

 nars_special_doctrine_name: "Hēgemon tou Pálai"
 nars_special_doctrine_no_actor: "Hegemons of Old"
 nars_special_doctrine_descriptive_name: "$nars_special_doctrine_name$"
 nars_special_doctrine_desc:  "We are heirs to an antiquate glory, once-forgotten now risen—the true hegemons of the world."

 nars_special_doctrine_2_name: "Philopolitēs"
 nars_special_doctrine_2_no_actor: "Scholar of Yore"
 nars_special_doctrine_2_descriptive_name: "$nars_special_doctrine_2_name$"
 nars_special_doctrine_2_desc:  "We are scholars of a bygone era, witness to the long history—ageless scions of yore."

